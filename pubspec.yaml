name: habittracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  go_router: ^18.0.1
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  flutter_hooks: ^0.20.5
  cached_network_image: ^3.3.1
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_driver:
    sdk: flutter
  test: ^1.24.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env